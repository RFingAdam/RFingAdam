<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="t-icon-antenna d-icon-antenna">
  <title id="t-icon-antenna">Antenna icon</title>
  <desc id="d-icon-antenna">A simple dipole with a feed line, used as the RF-hardware mark.</desc>
  
    <style>
      .sweep-marker { transform-box: fill-box; transform-origin: center; }
      @media (prefers-reduced-motion: no-preference) {
        .sweep-marker { animation: tick 5.5s ease-in-out infinite; }
      }
      @keyframes tick {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.45; }
      }
      @media (prefers-reduced-motion: reduce) {
        .sweep-marker { animation: none; opacity: 1; }
      }
    </style>
    
  <rect width="64" height="64" fill="none"/>

        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <line x1="32" y1="54" x2="32" y2="30" stroke="#8A8074" stroke-width="1.8"/>
          <path d="M32 30 L20 16" stroke="#C67A3A" stroke-width="1.8"/>
          <path d="M32 30 L44 16" stroke="#C67A3A" stroke-width="1.8"/>
          <line x1="18" y1="16" x2="22" y2="16" stroke="#C67A3A" stroke-width="1.8"/>
          <line x1="42" y1="16" x2="46" y2="16" stroke="#C67A3A" stroke-width="1.8"/>
          <circle cx="32" cy="30" r="2.4" fill="#C67A3A" stroke="#C67A3A"/>
          <line x1="26" y1="54" x2="38" y2="54" stroke="#8A8074" stroke-width="1.8"/>
        </g>
        
</svg>
