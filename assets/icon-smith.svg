<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="t-icon-smith d-icon-smith">
  <title id="t-icon-smith">Smith chart icon</title>
  <desc id="d-icon-smith">A compact unit-circle Smith chart with one resistance circle and a short impedance locus.</desc>
  
    <style>
      .sweep-marker { transform-box: fill-box; transform-origin: center; }
      @media (prefers-reduced-motion: no-preference) {
        .sweep-marker { animation: tick 5.5s ease-in-out infinite; }
      }
      @keyframes tick {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.45; }
      }
      @media (prefers-reduced-motion: reduce) {
        .sweep-marker { animation: none; opacity: 1; }
      }
    </style>
    
  <rect width="64" height="64" fill="none"/>

        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="32" cy="32" r="20" stroke="#C67A3A" stroke-width="1.8"/>
          <circle cx="38" cy="32" r="10" stroke="#8A8074" stroke-width="1.3"/>
          <circle cx="42.7" cy="32" r="5.3" stroke="#8A8074" stroke-width="1.1"/>
          <line x1="12" y1="32" x2="52" y2="32" stroke="#8A8074" stroke-width="1"/>
          <path d="M18 38 C24 20, 36 22, 42 30 S48 40, 50 32" stroke="#C67A3A" stroke-width="1.8"/>
        </g>
        
</svg>
