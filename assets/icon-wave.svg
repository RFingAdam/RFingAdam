<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="t-icon-wave d-icon-wave">
  <title id="t-icon-wave">Sweep-trace icon</title>
  <desc id="d-icon-wave">A small VNA-style return-loss trace with a marker at the dip.</desc>
  
    <style>
      .sweep-marker { transform-box: fill-box; transform-origin: center; }
      @media (prefers-reduced-motion: no-preference) {
        .sweep-marker { animation: tick 5.5s ease-in-out infinite; }
      }
      @keyframes tick {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.45; }
      }
      @media (prefers-reduced-motion: reduce) {
        .sweep-marker { animation: none; opacity: 1; }
      }
    </style>
    
  <rect width="64" height="64" fill="none"/>

        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <rect x="10" y="12" width="44" height="40" rx="3" stroke="#8A8074" stroke-width="1.2"/>
          <path d="M14 22 C20 22, 22 22, 26 28 C30 44, 32 44, 36 28 C39 18, 42 22, 50 22" stroke="#C67A3A" stroke-width="1.8"/>
          <line x1="33" y1="16" x2="33" y2="48" stroke="#C43A22" stroke-width="1" stroke-opacity="0.9"/>
        </g>
        
</svg>
